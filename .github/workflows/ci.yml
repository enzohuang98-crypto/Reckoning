name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-client-preflight:
    name: Prepare isolated Windows 11 client VM
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify x64 execution on the isolated client
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          architecture: x64

      - name: Record real VM prerequisites without touching user data
        shell: pwsh
        run: ./tools/acceptance/windows-client-preflight.ps1 -OutputPath "$env:RUNNER_TEMP/windows-client-preflight.json"

      - name: Upload environment evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-client-preflight
          path: ${{ runner.temp }}/windows-client-preflight.json
          retention-days: 7
          if-no-files-found: error

  verify:
    name: Verify Windows desktop app
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile the test engine
        uses: ./.github/actions/compile-fake-engine

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Run AI acceptance self-test
        run: npm run test:acceptance:ai

      - name: Audit dependencies
        run: npm run security:audit

      - name: Build production bundles
        run: npm run build
